# Starts templates the way Portainer would, then checks they come up and answer.
# Tests what a PR adds, whatever you name on demand, and every app source weekly
name: 🧪 Test template

on:
  pull_request:
    branches: [main]
    paths:
      - 'sources.csv'
      - 'sources/local/**'
      - 'sources/stacks/**'
  workflow_dispatch:
    inputs:
      templates:
        description: 'Source names, template URLs or titles, comma-separated (blank for every app source)'
        required: false
        type: string
      start:
        description: 'Start each one, rather than only checking it'
        required: false
        type: boolean
        default: true
      timeout:
        description: 'Seconds to wait for each app to come up'
        required: false
        type: number
        default: 180
  schedule:
    - cron: '0 3 * * 1' # Weekly audit of every app source, Mondays at 03:00

# Read-only, and no secrets, so it's safe to run on fork PRs
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Test template
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR checks out as a merge commit, and its first parent is the base it merged onto
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: lib/requirements.txt

      - name: Install dependencies
        run: pip install -r lib/requirements.txt

      # A PR tests only what it adds or changes, and passes when that's nothing
      - name: Test templates
        env:
          EVENT: ${{ github.event_name }}
          TEMPLATES: ${{ inputs.templates }}
          START: ${{ inputs.start }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          set -euo pipefail
          args=(--report report.md --timeout "${TIMEOUT:-180}")
          if [ "$START" = false ]; then
            args+=(--no-start)
          fi
          if [ "$EVENT" = pull_request ]; then
            args+=(--changed HEAD^1)
          elif [ -n "$TEMPLATES" ]; then
            IFS=, read -ra targets <<< "$TEMPLATES"
            args+=(-- "${targets[@]}")
          fi
          python lib/test_template.py "${args[@]}"

      - name: Upload report
        if: always() && hashFiles('report.md') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-test-report
          path: report.md
